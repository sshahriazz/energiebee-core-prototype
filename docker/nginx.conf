# nginx in front of the EnergieBee core app: serves the static site from /app/public and
# proxies /api/ to the Node app on 127.0.0.1:4100 (the first sync after a fresh start can take
# a minute, so the proxy timeouts are long).
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream core_app { server 127.0.0.1:4100; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.html;

    # The API: everything under /api/ (data fetching, sync, explorer, raw payloads).
    location /api/ {
      proxy_pass http://core_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;   # a sync or a full rebuild can take a while
      proxy_buffering on;
      proxy_buffers 16 64k;
      proxy_buffer_size 64k;
    }

    # Static assets: short cache (the files are not fingerprinted), always revalidated.
    location ~* \.(css|js|svg|png|ico|jpg|jpeg|webp|woff2?)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Pages: /, /timeline, /timeline.html ... (the app's own static handler allows both forms).
    location / {
      try_files $uri $uri.html $uri/ =404;
      add_header Cache-Control "no-cache";
    }
  }
}
