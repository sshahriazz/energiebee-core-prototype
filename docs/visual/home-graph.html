<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergieBee Home Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a floor plan of the home on the left (rooms as plan outlines, devices as tags, links as coloured lines),
   a detail panel on the right; stacks to one column on a phone. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --ink: #15212b; --muted: #5a6876; --line: #c3cdd6; --plan: #8a99a8;
  --room: #fbfcfd; --wide: #edf2f6; --elec: #0d7a84; --heat: #cf5b25; --ctrl: #6a48bf; --hub: #a8700f; --cloud: #3567cf;
  --chip: #e6edf2; --sel: #0d7a84; --price: #8a5a00;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #151f28; --ink: #e3eaf0; --muted: #94a2af; --line: #2c3a47; --plan: #61717f;
  --room: #121b23; --wide: #17222c; --elec: #3cc0c9; --heat: #ef8a4c; --ctrl: #a68cf0; --hub: #e2a84a; --cloud: #719cf5;
  --chip: #1d2934; --sel: #3cc0c9; --price: #e2b24f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #151f28; --ink: #e3eaf0; --muted: #94a2af; --line: #2c3a47; --plan: #61717f;
  --room: #121b23; --wide: #17222c; --elec: #3cc0c9; --heat: #ef8a4c; --ctrl: #a68cf0; --hub: #e2a84a; --cloud: #719cf5;
  --chip: #1d2934; --sel: #3cc0c9; --price: #e2b24f; color-scheme: dark; }

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header h1 { font-family: var(--f-display); font-weight: 600; font-size: 28px; letter-spacing: .01em; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
button.seg, button.tog, button.sys { font: 500 13px var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
button.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button.tog[aria-pressed="false"] { background: transparent; border-color: var(--line); color: var(--muted); }
button.tog[aria-pressed="false"] .sw { opacity: .35; }
button.sys[aria-pressed="true"] { border-color: var(--ink); }
button:focus-visible, .node:focus-visible, .roomhit:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.sw.elec { background: var(--elec); } .sw.heat { background: var(--heat); } .sw.ctrl { background: repeating-linear-gradient(90deg, var(--ctrl) 0 3px, transparent 3px 5px); } .sw.hub { background: repeating-linear-gradient(90deg, var(--hub) 0 5px, transparent 5px 8px); } .sw.room { height: 10px; width: 12px; border: 1.5px solid var(--plan); background: var(--room); border-radius: 2px; }
.main { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; min-width: 0; }
.canvas svg { display: block; width: 100%; min-width: 640px; height: auto; }
.note { font-size: 13px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.note b { color: var(--ink); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-block; font: 500 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.pill.hub { color: var(--hub); } .pill.cloud { color: var(--cloud); } .pill.rw { color: var(--ctrl); }
table.pts { width: 100%; border-collapse: collapse; font-size: 13px; }
table.pts th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 0 6px 4px 0; }
table.pts td { padding: 3px 6px 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.pts td.v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.ex { font-size: 11px; color: var(--muted); font-style: italic; }
.lanes svg { width: 100%; height: auto; display: block; }

/* plan drawing */
.floorlbl { font: 600 12px var(--f-display); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.roomrect { fill: var(--room); stroke: var(--plan); stroke-width: 1.6; }
.roomrect.wide { fill: var(--wide); stroke-dasharray: 6 5; }
.roomrect.outdoor { fill: none; stroke-dasharray: 2 4; }
.roomrect.sel { stroke: var(--sel); stroke-width: 2.6; }
.roomlbl { font: 500 12px var(--f-body); fill: var(--muted); }
.roomhit { cursor: pointer; }
.edge { fill: none; stroke-width: 2.2; }
.edge.energy { stroke: var(--elec); }
.edge.heat { stroke: var(--heat); stroke-width: 2; }
.edge.control { stroke: var(--ctrl); stroke-width: 1.5; stroke-dasharray: 3 4; }
.edge.hub { stroke: var(--hub); stroke-width: 1.2; stroke-dasharray: 6 5; opacity: .7; }
.edge.cloud { stroke: var(--cloud); stroke-width: 1.2; stroke-dasharray: 2 5; opacity: .75; }
.pulse { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 1 15; animation: flow 1.4s linear infinite; opacity: .9; pointer-events: none; }
.pulse.energy { stroke: var(--surface); } .pulse.heat { stroke: var(--surface); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
.edgelbl { font: 500 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.node.hubnode rect { stroke: var(--hub); stroke-width: 2; }
.node.derived rect { stroke-dasharray: 4 3; stroke: var(--muted); }
.node.cloudnode rect { stroke: var(--cloud); stroke-width: 2; }
.node text { font: 500 12px var(--f-body); fill: var(--ink); pointer-events: none; }
.node .tag { font: 500 9.5px var(--f-mono); fill: var(--muted); }
.node.sel rect { stroke: var(--sel); stroke-width: 3; }
.dim { opacity: .18; transition: opacity .15s; }
.halo { fill: none; stroke-width: 9; opacity: .22; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EnergieBee Home Graph</h1>
    <p>Every room and device as a thing, placed in the spatial tree (where it is) and linked in the energy system graph (how energy and heat flow). Click a device or a room to see its points, how it is reached and its timeline.</p>
  </header>

  <div class="bar" role="toolbar" aria-label="View">
    <div class="group" id="presets"><span class="lbl">Home</span></div>
    <div class="group" id="layers"><span class="lbl">Show</span></div>
    <div class="group" id="systems"><span class="lbl">System</span></div>
  </div>

  <div class="main">
    <div class="canvas">
      <svg id="plan" viewBox="0 0 1000 640" role="img" aria-labelledby="plan-title">
        <title id="plan-title">Floor plan of the home with its devices and links</title>
        <defs>
          <marker id="ar-energy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--elec)"/></marker>
          <marker id="ar-heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--heat)"/></marker>
          <marker id="ar-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--ctrl)"/></marker>
        </defs>
        <g id="g-rooms"></g><g id="g-halos"></g><g id="g-edges"></g><g id="g-nodes"></g>
      </svg>
      <div class="note" id="note"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
// ───────────── the two homes (example values, not live data) ─────────────
const P = (key, cls, access, unit, ex) => ({ key, cls, access, unit, ex });
const CAPS = {
  inverter: { caps: ['power_meter', 'energy_meter', 'grid_connection'], pts: [P('ac_power', 'measurement', 'read', 'W', 1840), P('ac_energy', 'total', 'read', 'kWh', 4211.6), P('work_mode', 'state', 'readwrite', '', 'self-use'), P('export_limit', 'setpoint', 'readwrite', 'W', 3680)] },
  pv: { caps: ['pv_generation'], pts: [P('power', 'measurement', 'read', 'W', 2310), P('energy', 'total', 'read', 'kWh', 9120.4), P('forecast', 'measurement', 'read', 'kWh / slot', 0.82)] },
  battery: { caps: ['battery_storage'], pts: [P('soc', 'measurement', 'read', '%', 64), P('charge_power', 'measurement', 'read', 'W', 0), P('discharge_power', 'measurement', 'read', 'W', 520), P('reserve', 'setpoint', 'readwrite', '%', 20), P('charge_window', 'setpoint', 'readwrite', '', '23:30–05:30')] },
  meter: { caps: ['energy_meter'], pts: [P('import', 'total', 'read', 'kWh', 18422.1), P('export', 'total', 'read', 'kWh', 3104.7), P('import_power', 'measurement', 'read', 'W', 240)] },
  gas: { caps: ['energy_meter'], pts: [P('volume', 'total', 'read', 'm³', 3381.2)] },
  heatpump: { caps: ['heat_source', 'energy_meter', 'thermostat'], pts: [P('flow_temp', 'measurement', 'read', '°C', 38.5), P('return_temp', 'measurement', 'read', '°C', 33.0), P('heat_output', 'total', 'read', 'kWh', 6120.0), P('electricity', 'total', 'read', 'kWh', 1980.3), P('mode', 'state', 'readwrite', '', 'heating'), P('target_flow', 'setpoint', 'readwrite', '°C', 40)] },
  radiator: { caps: ['emitter'], pts: [P('surface_temp', 'measurement', 'read', '°C', 36.2)] },
  trv: { caps: ['valve', 'thermostat'], pts: [P('valve_position', 'measurement', 'read', '%', 45), P('room_temp', 'measurement', 'read', '°C', 20.1), P('target_temp', 'setpoint', 'readwrite', '°C', 20.5)] },
  thermostat: { caps: ['thermostat'], pts: [P('indoor_temp', 'measurement', 'read', '°C', 20.4), P('target_temp', 'setpoint', 'readwrite', '°C', 21)] },
  sensor: { caps: ['temperature_sensor'], pts: [P('temperature', 'measurement', 'read', '°C', 19.6), P('humidity', 'measurement', 'read', '%', 52)] },
  plug: { caps: ['on_off', 'power_meter', 'energy_meter'], pts: [P('relay', 'state', 'readwrite', '', 'on'), P('power', 'measurement', 'read', 'W', 86), P('energy', 'total', 'read', 'kWh', 412.9)] },
  evcharger: { caps: ['ev_charging', 'power_meter'], pts: [P('charge_power', 'measurement', 'read', 'W', 0), P('session_energy', 'total', 'read', 'kWh', 11.4), P('current', 'setpoint', 'readwrite', 'A', 16), P('mode', 'state', 'readwrite', '', 'scheduled')] },
  ev: { caps: ['battery_storage'], pts: [P('soc', 'measurement', 'read', '%', 71), P('plugged_in', 'event', 'read', '', 'yes')] },
  hub: { caps: ['hub_health'], pts: [P('link', 'state', 'read', '', 'connected'), P('buffer_depth', 'measurement', 'read', 'msgs', 0), P('clock_skew', 'measurement', 'read', 'ms', 12), P('program', 'state', 'read', '', 'v42 · TTL 6 h')] },
  supply: { caps: ['derived'], pts: [P('home_use', 'measurement', 'read', 'W', 2040)] },
  untracked: { caps: ['derived'], pts: [P('untracked', 'measurement', 'read', 'W', 410)] },
};
const ROOMS_LAYOUT = {
  wall: { name: 'Outside wall', floor: 'Outside', x: 20, y: 52, w: 150, h: 210, kind: 'outdoor' },
  drive: { name: 'Driveway', floor: 'Outside', x: 20, y: 282, w: 150, h: 330, kind: 'outdoor' },
  living: { name: 'Living room', floor: 'Ground floor', x: 192, y: 52, w: 236, h: 330, kind: 'room' },
  kitchen: { name: 'Kitchen', floor: 'Ground floor', x: 438, y: 52, w: 208, h: 168, kind: 'room' },
  garage: { name: 'Garage', floor: 'Ground floor', x: 438, y: 230, w: 208, h: 152, kind: 'room' },
  bedroom: { name: 'Bedroom', floor: 'First floor', x: 666, y: 52, w: 314, h: 330, kind: 'room' },
  wide: { name: 'Home-wide: in the energy graph, no room needed', floor: '', x: 192, y: 414, w: 788, h: 198, kind: 'wide' },
};
const FLOORS = [['Outside', 20, 40], ['Ground floor', 192, 40], ['First floor', 666, 40]];

const PRESETS = {
  example: {
    label: 'Example home with a hub',
    note: '<b>Every device talks through the local hub.</b> The hub discovered each one and gave it its id; the core placed it in a room and in the energy graph. Turn on Hub links to see which.',
    rooms: ['wall', 'drive', 'living', 'kitchen', 'garage', 'bedroom', 'wide'],
    things: [
      { id: 'hub', name: 'Local hub', type: 'hub', room: 'wide', x: 250, y: 470, link: null },
      { id: 'meter', name: 'Import/export meter', type: 'meter', room: 'wall', x: 95, y: 130, link: ['hub', 'P1 port'] },
      { id: 'gas', name: 'Gas meter', type: 'gas', room: 'wall', x: 95, y: 210, link: ['hub', 'CAD (Zigbee)'] },
      { id: 'evc', name: 'EV charger', type: 'evcharger', room: 'drive', x: 95, y: 380, link: ['hub', 'OCPP local'], systems: ['ev'] },
      { id: 'ev', name: 'EV', type: 'ev', room: 'drive', x: 95, y: 520, link: ['hub', 'via charger'], systems: ['ev'] },
      { id: 'therm', name: 'Thermostat', type: 'thermostat', room: 'living', x: 262, y: 110, link: ['hub', 'Zigbee'], systems: ['heat'] },
      { id: 'ts1', name: 'Temp sensor', type: 'sensor', room: 'living', x: 362, y: 175, link: ['hub', 'Zigbee'] },
      { id: 'trv1', name: 'TRV', type: 'trv', room: 'living', x: 262, y: 255, link: ['hub', 'Zigbee'], systems: ['heat'] },
      { id: 'rad1', name: 'Radiator', type: 'radiator', room: 'living', x: 360, y: 325, link: null, systems: ['heat'] },
      { id: 'plug1', name: 'Plug · dishwasher', type: 'plug', room: 'kitchen', x: 520, y: 100, link: ['hub', 'Wi-Fi local'] },
      { id: 'trv2', name: 'TRV', type: 'trv', room: 'kitchen', x: 490, y: 175, link: ['hub', 'Zigbee'], systems: ['heat'] },
      { id: 'rad2', name: 'Radiator', type: 'radiator', room: 'kitchen', x: 590, y: 175, link: null, systems: ['heat'] },
      { id: 'plug2', name: 'Plug · freezer', type: 'plug', room: 'garage', x: 542, y: 300, link: ['hub', 'Wi-Fi local'] },
      { id: 'ts2', name: 'Temp sensor', type: 'sensor', room: 'bedroom', x: 760, y: 120, link: ['hub', 'Zigbee'] },
      { id: 'trv3', name: 'TRV', type: 'trv', room: 'bedroom', x: 760, y: 260, link: ['hub', 'Zigbee'], systems: ['heat'] },
      { id: 'rad3', name: 'Radiator', type: 'radiator', room: 'bedroom', x: 890, y: 260, link: null, systems: ['heat'] },
      { id: 'pv', name: 'PV array', type: 'pv', room: 'wide', x: 410, y: 455, link: ['hub', 'via inverter'], systems: ['solar'] },
      { id: 'inv', name: 'Inverter', type: 'inverter', room: 'wide', x: 410, y: 545, link: ['hub', 'Modbus / SunSpec'], systems: ['solar'] },
      { id: 'bat', name: 'Battery', type: 'battery', room: 'wide', x: 560, y: 590, link: ['hub', 'via inverter'], systems: ['solar'] },
      { id: 'supply', name: 'Home supply', type: 'supply', room: 'wide', x: 600, y: 500, link: null, derived: true },
      { id: 'hp', name: 'Heat pump', type: 'heatpump', room: 'wide', x: 790, y: 470, link: ['hub', 'Modbus'], systems: ['heat'] },
      { id: 'unt', name: 'Untracked', type: 'untracked', room: 'wide', x: 790, y: 575, link: null, derived: true },
    ],
    edges: [
      ['meter', 'inv', 'energy', 'grid', true], ['pv', 'inv', 'energy', 'dc'], ['inv', 'bat', 'energy', 'charge / discharge', true],
      ['inv', 'supply', 'energy', 'ac'], ['supply', 'evc', 'energy'], ['evc', 'ev', 'energy'], ['supply', 'hp', 'energy'],
      ['supply', 'plug1', 'energy'], ['supply', 'plug2', 'energy'], ['supply', 'unt', 'energy'],
      ['hp', 'rad1', 'heat'], ['hp', 'rad2', 'heat'], ['hp', 'rad3', 'heat'],
      ['therm', 'hp', 'control'], ['trv1', 'rad1', 'control'], ['trv2', 'rad2', 'control'], ['trv3', 'rad3', 'control'],
    ],
    systems: { solar: 'Solar + battery', heat: 'Heating', ev: 'EV charging' },
  },
  home1: {
    label: 'Home 1 today',
    note: '<b>No hub yet.</b> Home 1\'s devices are reached through cloud connectors (Sunsynk, Octopus). When a hub arrives, its link takes over and the things keep their ids and timelines.',
    rooms: ['wall', 'drive', 'wide'],
    things: [
      { id: 'meter', name: 'Import/export meter', type: 'meter', room: 'wall', x: 95, y: 130, link: ['cloud', 'Octopus account'] },
      { id: 'gas', name: 'Gas meter', type: 'gas', room: 'wall', x: 95, y: 210, link: ['cloud', 'Octopus account'] },
      { id: 'ev', name: 'BMW 530e', type: 'ev', room: 'drive', x: 95, y: 420, link: ['cloud', 'Octopus Kraken (external controller)'], systems: ['ev'] },
      { id: 'pv', name: 'PV array', type: 'pv', room: 'wide', x: 410, y: 455, link: ['cloud', 'Sunsynk Connect'], systems: ['solar'] },
      { id: 'inv', name: 'Inverter', type: 'inverter', room: 'wide', x: 410, y: 545, link: ['cloud', 'Sunsynk Connect'], systems: ['solar'] },
      { id: 'bat', name: 'Battery', type: 'battery', room: 'wide', x: 560, y: 590, link: ['cloud', 'Sunsynk Connect'], systems: ['solar'] },
      { id: 'supply', name: 'Home supply', type: 'supply', room: 'wide', x: 600, y: 500, link: null, derived: true },
      { id: 'unt', name: 'Untracked', type: 'untracked', room: 'wide', x: 790, y: 520, link: null, derived: true },
      { id: 'cloudSun', name: 'Sunsynk cloud', type: 'cloud', room: 'wide', x: 250, y: 470, link: null, cloudSource: true },
      { id: 'cloudOct', name: 'Octopus cloud', type: 'cloud', room: 'wide', x: 250, y: 575, link: null, cloudSource: true },
    ],
    edges: [
      ['meter', 'inv', 'energy', 'grid', true], ['pv', 'inv', 'energy', 'dc'], ['inv', 'bat', 'energy', 'charge / discharge', true],
      ['inv', 'supply', 'energy', 'ac'], ['supply', 'ev', 'energy', 'charging'], ['supply', 'unt', 'energy'],
    ],
    systems: { solar: 'Solar + battery', ev: 'EV charging' },
  },
};
const TYPE_LABEL = { hub: 'hub', meter: 'meter_import', gas: 'meter_gas', evcharger: 'ev_charger', ev: 'ev', thermostat: 'thermostat', sensor: 'temperature_sensor', trv: 'trv', radiator: 'emitter', plug: 'smart_plug', pv: 'pv_array', inverter: 'inverter', battery: 'battery', supply: 'home_supply (derived)', heatpump: 'heat_pump', untracked: 'untracked (derived)', cloud: 'cloud connector' };

// ───────────── state ─────────────
const state = { preset: 'example', layers: { rooms: true, energy: true, heat: true, control: true, links: false }, system: null, selected: null, room: null };
try { const s = JSON.parse(localStorage.getItem('homegraph') || '{}'); if (s.preset && PRESETS[s.preset]) state.preset = s.preset; } catch {}
const save = () => { try { localStorage.setItem('homegraph', JSON.stringify({ preset: state.preset })); } catch {} };

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ───────────── toolbar ─────────────
function toolbar() {
  const pr = $('presets'); pr.querySelectorAll('button').forEach((b) => b.remove());
  for (const [k, p] of Object.entries(PRESETS)) {
    const b = document.createElement('button'); b.className = 'seg'; b.id = `preset-${k}`; b.textContent = p.label;
    b.setAttribute('aria-pressed', String(state.preset === k));
    b.onclick = () => { state.preset = k; state.selected = null; state.room = null; state.system = null; save(); render(); };
    pr.appendChild(b);
  }
  const ly = $('layers'); ly.querySelectorAll('button').forEach((b) => b.remove());
  const L = [['rooms', 'Rooms', 'room'], ['energy', 'Energy', 'elec'], ['heat', 'Heat', 'heat'], ['control', 'Controls', 'ctrl'], ['links', state.preset === 'home1' ? 'Cloud links' : 'Hub links', 'hub']];
  for (const [k, label, sw] of L) {
    const b = document.createElement('button'); b.className = 'tog'; b.id = `layer-${k}`;
    b.innerHTML = `<span class="sw ${sw}" aria-hidden="true"></span>${label}`;
    b.setAttribute('aria-pressed', String(state.layers[k]));
    b.onclick = () => { state.layers[k] = !state.layers[k]; render(); };
    ly.appendChild(b);
  }
  const sy = $('systems'); sy.querySelectorAll('button').forEach((b) => b.remove());
  for (const [k, name] of Object.entries(PRESETS[state.preset].systems)) {
    const b = document.createElement('button'); b.className = 'sys'; b.id = `system-${k}`; b.textContent = name;
    b.setAttribute('aria-pressed', String(state.system === k));
    b.onclick = () => { state.system = state.system === k ? null : k; state.selected = null; state.room = null; render(); };
    sy.appendChild(b);
  }
}

// ───────────── drawing ─────────────
const nodeW = (t) => Math.max(78, t.name.length * 6.9 + 22);
function render() {
  toolbar();
  const p = PRESETS[state.preset];
  const things = new Map(p.things.map((t) => [t.id, t]));
  $('note').innerHTML = `<span>${p.note}</span>`;
  // Rooms and floors
  const gR = $('g-rooms'); gR.replaceChildren();
  for (const [name, x, y] of FLOORS) if (p.rooms.some((r) => ROOMS_LAYOUT[r].floor === name)) el('text', { x, y, class: 'floorlbl' }, gR).textContent = name;
  for (const r of p.rooms) {
    const R = ROOMS_LAYOUT[r];
    const g = el('g', { class: 'roomhit', tabindex: R.kind === 'wide' ? -1 : 0, role: 'button', 'aria-label': `Room ${R.name}` }, gR);
    el('rect', { x: R.x, y: R.y, width: R.w, height: R.h, rx: 6, class: `roomrect ${R.kind}${state.room === r ? ' sel' : ''}` }, g);
    el('text', { x: R.x + 10, y: R.y + 18, class: 'roomlbl' }, g).textContent = R.name;
    if (R.kind !== 'wide') { g.onclick = () => selectRoom(r); g.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRoom(r); } }; }
    if (!state.layers.rooms) g.style.display = 'none';
  }
  // System halos
  const gH = $('g-halos'); gH.replaceChildren();
  if (state.system) for (const t of p.things) if ((t.systems || []).includes(state.system)) {
    el('rect', { x: t.x - nodeW(t) / 2 - 7, y: t.y - 22, width: nodeW(t) + 14, height: 44, rx: 12, class: 'halo', style: `stroke: var(--${state.system === 'heat' ? 'heat' : state.system === 'ev' ? 'cloud' : 'elec'})` }, gH);
  }
  // Edges
  const gE = $('g-edges'); gE.replaceChildren();
  const edges = p.edges.map(([a, b, rel, label, bidir]) => ({ a, b, rel, label, bidir }));
  for (const t of p.things) if (t.link && state.layers.links) {
    if (t.link[0] === 'hub' && things.has('hub')) edges.push({ a: 'hub', b: t.id, rel: 'hub' });
    if (t.link[0] === 'cloud') edges.push({ a: /Sunsynk/.test(t.link[1]) ? 'cloudSun' : 'cloudOct', b: t.id, rel: 'cloud' });
  }
  const focus = focusSet(p, things);
  for (const e of edges) {
    if ((e.rel === 'energy' && !state.layers.energy) || (e.rel === 'heat' && !state.layers.heat) || (e.rel === 'control' && !state.layers.control)) continue;
    const A = things.get(e.a); const B = things.get(e.b);
    if (!A || !B) continue;
    const mx = (A.x + B.x) / 2; const my = (A.y + B.y) / 2;
    const dx = B.x - A.x; const dy = B.y - A.y; const len = Math.hypot(dx, dy) || 1;
    const bend = e.rel === 'hub' || e.rel === 'cloud' ? 0 : Math.min(40, len * 0.12);
    const cx = mx - (dy / len) * bend; const cy = my + (dx / len) * bend;
    const [ax, ay] = edgePoint(A, cx, cy); const [bx, by] = edgePoint(B, cx, cy);
    const d = `M${ax},${ay} Q${cx},${cy} ${bx},${by}`;
    const path = el('path', { d, class: `edge ${e.rel}` }, gE);
    if (e.rel === 'energy' || e.rel === 'heat' || e.rel === 'control') {
      path.setAttribute('marker-end', `url(#ar-${e.rel})`);
      if (e.bidir) path.setAttribute('marker-start', `url(#ar-${e.rel})`);
    }
    if (focus && !(focus.has(e.a) && focus.has(e.b))) path.classList.add('dim');
    if ((e.rel === 'energy' || e.rel === 'heat') && !e.bidir && !(focus && !(focus.has(e.a) && focus.has(e.b)))) el('path', { d, class: `pulse ${e.rel}` }, gE);
    if (e.label) { const t = el('text', { x: (ax + 2 * cx + bx) / 4, y: (ay + 2 * cy + by) / 4 - 4, 'text-anchor': 'middle', class: 'edgelbl' }, gE); t.textContent = e.label; if (focus && !(focus.has(e.a) && focus.has(e.b))) t.classList.add('dim'); }
  }
  // Nodes
  const gN = $('g-nodes'); gN.replaceChildren();
  for (const t of p.things) {
    const w = nodeW(t);
    const cls = ['node', t.type === 'hub' ? 'hubnode' : '', t.derived ? 'derived' : '', t.cloudSource ? 'cloudnode' : '', state.selected === t.id ? 'sel' : ''].join(' ');
    const g = el('g', { class: cls, tabindex: 0, role: 'button', 'aria-label': `${t.name}, ${TYPE_LABEL[t.type] ?? t.type}` }, gN);
    el('rect', { x: t.x - w / 2, y: t.y - 15, width: w, height: 30, rx: 6 }, g);
    el('text', { x: t.x, y: t.y + 4, 'text-anchor': 'middle' }, g).textContent = t.name;
    if (focus && !focus.has(t.id)) g.classList.add('dim');
    g.onclick = () => selectThing(t.id);
    g.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectThing(t.id); } };
    g.onmouseenter = () => hover(t.id, true); g.onmouseleave = () => hover(t.id, false);
  }
  panel();
}
function edgePoint(t, tx, ty) {
  const w = nodeW(t) / 2; const h = 15; const dx = tx - t.x; const dy = ty - t.y;
  const s = Math.min(w / Math.abs(dx || 1e-6), h / Math.abs(dy || 1e-6));
  return [t.x + dx * Math.min(s, 1), t.y + dy * Math.min(s, 1)];
}
function focusSet(p, things) {
  if (state.system) return new Set(p.things.filter((t) => (t.systems || []).includes(state.system)).map((t) => t.id));
  if (state.selected) { const s = new Set([state.selected]); for (const [a, b] of p.edges) { if (a === state.selected) s.add(b); if (b === state.selected) s.add(a); } return s; }
  if (state.room) return new Set(p.things.filter((t) => t.room === state.room).map((t) => t.id));
  return null;
}
function hover(id, on) {
  if (state.selected || state.system || state.room) return;
  const p = PRESETS[state.preset];
  const near = new Set([id]); for (const [a, b] of p.edges) { if (a === id) near.add(b); if (b === id) near.add(a); }
  const ids = p.things.map((t) => t.id);
  [...$('g-nodes').children].forEach((g, i) => g.classList.toggle('dim', on && !near.has(ids[i])));
}
function selectThing(id) { state.selected = state.selected === id ? null : id; state.room = null; state.system = null; render(); }
function selectRoom(r) { state.room = state.room === r ? null : r; state.selected = null; state.system = null; render(); }

// ───────────── panel ─────────────
function panel() {
  const p = PRESETS[state.preset]; const pane = $('panel');
  if (state.selected) return thingPanel(p.things.find((t) => t.id === state.selected), p, pane);
  if (state.room) return roomPanel(state.room, p, pane);
  if (state.system) return systemPanel(state.system, p, pane);
  const dev = p.things.filter((t) => !t.derived && !t.cloudSource);
  const viaHub = dev.filter((t) => t.link?.[0] === 'hub').length; const viaCloud = dev.filter((t) => t.link?.[0] === 'cloud').length;
  pane.innerHTML = `<h2>${esc(p.label)}</h2>
    <dl class="kv"><dt>Devices</dt><dd>${dev.length}</dd><dt>Rooms</dt><dd>${p.rooms.filter((r) => ROOMS_LAYOUT[r].kind !== 'wide').length}</dd>
    <dt>Reached through</dt><dd>${viaHub ? `<span class="pill hub">hub · ${viaHub}</span> ` : ''}${viaCloud ? `<span class="pill cloud">cloud · ${viaCloud}</span>` : ''}</dd>
    <dt>Systems</dt><dd>${Object.values(p.systems).join(' · ')}</dd></dl>
    <div><h3>How to read it</h3><ul class="plain">
      <li><span class="sw room"></span> A room or space: the spatial tree (<span class="mono">located_in</span>).</li>
      <li><span class="sw elec"></span> Energy flowing between devices (<span class="mono">feeds</span>, through ports).</li>
      <li><span class="sw heat"></span> Heat from the heat pump to the radiators.</li>
      <li><span class="sw ctrl"></span> A device that controls another (<span class="mono">controls</span>).</li>
      <li><span class="sw hub"></span> ${state.preset === 'home1' ? 'The cloud connector a device is reached through.' : 'The hub a device talks through (<span class="mono">served_by</span>).'}</li>
    </ul></div>
    <p class="muted" style="margin:0">Home-wide equipment sits in the energy graph and needs no room. Energy totals follow the arrows, never the rooms, so nothing is counted twice: untracked is the home supply minus its metered loads.</p>`;
}
function thingPanel(t, p, pane) {
  const def = CAPS[t.type] || { caps: [], pts: [] };
  const R = ROOMS_LAYOUT[t.room];
  const rel = [];
  for (const [a, b, r, label] of p.edges) {
    const other = a === t.id ? b : b === t.id ? a : null; if (!other) continue;
    const o = p.things.find((x) => x.id === other);
    const verb = r === 'energy' ? (a === t.id ? 'feeds' : 'fed by') : r === 'heat' ? (a === t.id ? 'heats' : 'heated by') : (a === t.id ? 'controls' : 'controlled by');
    rel.push(`<li><span class="mono">${verb}</span> ${esc(o.name)}${label ? ` <span class="muted">(${esc(label)})</span>` : ''}</li>`);
  }
  if (R && R.kind !== 'wide') rel.unshift(`<li><span class="mono">located_in</span> ${esc(R.name)}</li>`);
  for (const s of t.systems || []) rel.push(`<li><span class="mono">part_of</span> ${esc(p.systems[s])}</li>`);
  const link = t.link ? `<span class="pill ${t.link[0]}">${t.link[0]}</span> ${esc(t.link[1])}` : (t.derived ? 'derived from other points' : t.cloudSource ? 'a cloud connector (not a device)' : t.type === 'hub' ? 'the hub itself: HLP over MQTT 5 with mTLS' : 'no electronics: read through its TRV');
  pane.innerHTML = `<h2>${esc(t.name)}</h2>
    <dl class="kv"><dt>Kind · type</dt><dd><span class="mono">${t.derived ? 'point' : t.cloudSource ? 'connector' : 'device'}</span> · <span class="mono">${esc(TYPE_LABEL[t.type] ?? t.type)}</span></dd>
    <dt>Where</dt><dd>${R ? (R.kind === 'wide' ? 'home-wide (no room)' : esc(R.name)) : '—'}</dd>
    <dt>Reached through</dt><dd>${link}</dd>
    <dt>Capabilities</dt><dd>${def.caps.map((c) => `<span class="pill">${c}</span>`).join(' ') || '—'}</dd></dl>
    ${def.pts.length ? `<div><h3>Points</h3><table class="pts"><thead><tr><th>Point</th><th>Class</th><th style="text-align:right">Now</th></tr></thead><tbody>
      ${def.pts.map((x) => `<tr><td class="mono">${x.key}${x.access !== 'read' ? ' <span class="pill rw">rw</span>' : ''}</td><td>${x.cls}</td><td class="v">${typeof x.ex === 'number' ? x.ex.toLocaleString('en-GB') : esc(x.ex)} ${esc(x.unit)}</td></tr>`).join('')}
    </tbody></table><div class="ex">Example values.</div></div>` : ''}
    ${rel.length ? `<div><h3>Relationships</h3><ul class="plain">${rel.join('')}</ul></div>` : ''}
    ${def.pts.length ? `<div class="lanes"><h3>Its timeline, today</h3>${lanes(t, def)}<div class="ex">Example values: 30-minute slots, now at 17:00.</div></div>` : ''}`;
}
function roomPanel(r, p, pane) {
  const R = ROOMS_LAYOUT[r]; const members = p.things.filter((t) => t.room === r);
  const temps = members.filter((t) => ['sensor', 'thermostat', 'trv'].includes(t.type));
  const energy = members.filter((t) => ['plug', 'evcharger', 'meter'].includes(t.type));
  pane.innerHTML = `<h2>${esc(R.name)}</h2>
    <dl class="kv"><dt>Kind</dt><dd><span class="mono">space</span> · <span class="mono">${R.kind === 'outdoor' ? 'outdoor' : 'room'}</span></dd><dt>Floor</dt><dd>${esc(R.floor)}</dd><dt>Devices</dt><dd>${members.length}</dd></dl>
    <div><h3>Members (located_in)</h3><ul class="plain">${members.map((t) => `<li>${esc(t.name)} <span class="muted mono">${esc(TYPE_LABEL[t.type] ?? t.type)}</span></li>`).join('') || '<li class="muted">No devices yet</li>'}</ul></div>
    <div><h3>Its timeline (node_slot), this half-hour</h3><dl class="kv">
      ${temps.length ? `<dt>Temperature</dt><dd>20.3 °C <span class="muted">mean of ${temps.length} sensor${temps.length > 1 ? 's' : ''}</span></dd>` : ''}
      ${energy.length ? `<dt>Energy</dt><dd>${(0.06 * energy.length).toFixed(2)} kWh <span class="muted">through its meters, each kWh once</span></dd>` : ''}
      <dt>Data state</dt><dd>final <span class="muted">(decided by required members)</span></dd></dl><div class="ex">Example values.</div></div>
    <p class="muted" style="margin:0">A room adds up what its own devices meter. The home's power still follows the energy graph, so a plug in this room is never counted twice.</p>`;
}
function systemPanel(s, p, pane) {
  const members = p.things.filter((t) => (t.systems || []).includes(s));
  pane.innerHTML = `<h2>${esc(p.systems[s])}</h2>
    <dl class="kv"><dt>Kind</dt><dd><span class="mono">system</span></dd><dt>Members</dt><dd>${members.length}</dd></dl>
    <div><h3>Members (part_of)</h3><ul class="plain">${members.map((t) => `<li>${esc(t.name)} <span class="muted">${esc(ROOMS_LAYOUT[t.room].kind === 'wide' ? 'home-wide' : ROOMS_LAYOUT[t.room].name)}</span></li>`).join('')}</ul></div>
    <p class="muted" style="margin:0">A system groups things that work together, across rooms. It has its own timeline (node_slot) and can take one command that splits into a command per member.</p>`;
}

// Four lanes on one grid: actual (past), forecast (future), plan (writable things), price.
function lanes(t, def) {
  const N = 48; const NOW = 34; const W = 320; const lh = 30; const top = 6;
  let seed = [...t.id].reduce((s, c) => s + c.charCodeAt(0), 7);
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const shape = (i) => {
    const h = i / 2;
    if (t.type === 'pv') return Math.max(0, Math.sin(((h - 6.5) / 13) * Math.PI)) * (0.85 + rnd() * 0.15);
    if (['sensor', 'thermostat', 'trv'].includes(t.type)) return 0.5 + 0.25 * Math.sin(((h - 9) / 24) * 2 * Math.PI) + rnd() * 0.05;
    if (t.type === 'battery' || t.type === 'ev') return 0.3 + 0.6 * Math.max(0, Math.sin(((h - 8) / 16) * Math.PI)) + (h < 5.5 ? 0.3 : 0);
    return 0.15 + 0.35 * (Math.exp(-((h - 8) ** 2) / 4) + Math.exp(-((h - 18.5) ** 2) / 5)) + rnd() * 0.12;
  };
  const vals = Array.from({ length: N }, (_, i) => Math.min(1, shape(i)));
  const writable = def.pts.some((x) => x.access !== 'read');
  const rows = [['Actual', 'elec'], ['Forecast', 'cloud'], ['Plan', 'ctrl'], ['Price', 'price']];
  const sx = (i) => 62 + (i * (W - 70)) / N; const bw = (W - 70) / N - 0.8;
  let svg = `<svg viewBox="0 0 ${W} ${top + rows.length * lh + 14}" role="img" aria-label="Four lanes of ${esc(t.name)}'s timeline">`;
  rows.forEach(([name, tok], r) => {
    const y0 = top + r * lh; const base = y0 + lh - 6;
    svg += `<text x="0" y="${y0 + 16}" style="font:500 10px var(--f-mono);fill:var(--muted)">${name}</text>`;
    svg += `<line x1="62" x2="${W - 8}" y1="${base}" y2="${base}" style="stroke:var(--line)"/>`;
    for (let i = 0; i < N; i++) {
      let v = null;
      if (name === 'Actual' && i < NOW) v = vals[i];
      if (name === 'Forecast' && i >= NOW - 1) v = vals[i] * (0.9 + 0.2 * Math.sin(i));
      if (name === 'Plan' && writable && i >= NOW) v = (i >= 47 || i < 11) ? 0.9 : 0.35;
      if (name === 'Price') { const h = i / 2; v = h >= 16 && h < 19 ? 0.95 : h < 5.5 || h >= 23.5 ? 0.25 : 0.55; }
      if (v == null) continue;
      const hgt = Math.max(1.5, v * (lh - 12));
      svg += `<rect x="${sx(i).toFixed(1)}" y="${(base - hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" style="fill:var(--${tok});opacity:${name === 'Forecast' ? 0.45 : 0.85}"/>`;
    }
    if (name === 'Plan' && !writable) svg += `<text x="66" y="${base - 6}" style="font:400 10px var(--f-body);fill:var(--muted)">read-only: nothing to plan</text>`;
  });
  const nx = sx(NOW) - 0.4;
  svg += `<line x1="${nx}" x2="${nx}" y1="${top}" y2="${top + rows.length * lh - 4}" style="stroke:var(--ink);stroke-dasharray:2 2"/>`;
  svg += `<text x="${nx}" y="${top + rows.length * lh + 10}" text-anchor="middle" style="font:500 10px var(--f-mono);fill:var(--ink)">now</text>`;
  svg += `<text x="62" y="${top + rows.length * lh + 10}" style="font:400 10px var(--f-mono);fill:var(--muted)">00:00</text>`;
  svg += `<text x="${W - 8}" y="${top + rows.length * lh + 10}" text-anchor="end" style="font:400 10px var(--f-mono);fill:var(--muted)">24:00</text>`;
  return svg + '</svg>';
}

render();
</script>
</body>
</html>
